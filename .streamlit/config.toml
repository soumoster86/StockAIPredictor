# UI theme — safe to commit (no secrets). Tuned for the dark "terminal finance" look.

[theme]
base = "dark"
primaryColor = "#36b37e"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#161d27"
textColor = "#e8ecf1"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
